[project]
name = "baryonlang"
version = "1.1.0"
description = "Generates execution scripts (Python, R, Bash, Nextflow, Streamflow, Galaxy) for bioinformatics pipelines from .bala configuration files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Fairflow Bioinformatics Framework" }]
keywords = ["bioinformatics", "workflow", "nextflow", "galaxy", "streamflow"]

[project.urls]
Homepage = "https://github.com/Fairflow-BioinformaticsFramework/Baryonlang"
Publication = "https://doi.org/10.1016/j.array.2026.101150"

dependencies = []

[project.scripts]
baryon = "baryonlang.baryon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["baryonlang*"]