version: v1.0
workflows:
  sample_sheettolibinfo-workflow:
    type: cwl
    config:
      file: sample_sheettolibinfo.cwl
      settings: sample_sheettolibinfo-params.yml
    bindings:
      - step: /
        target:
          deployment: docker-sample_sheettolibinfo
deployments:
  docker-sample_sheettolibinfo:
    type: docker
    config:
      image: repbioinfo/htgts_pipeline_lts_v16:latest
      volume:
        # Path to the working directory   =====================>
        - /home/baseolo/Baryon_SourceCode/test/testdata/sample_sheettolibinfo/workingdir:/workingdir
        # Path to the folder containing input data and receiving output results   =====================>
        - /home/baseolo/Baryon_SourceCode/test/testdata/sample_sheettolibinfo/outdir:/outDir