version: v1.0
workflows:
  index_align_scrs-workflow:
    type: cwl
    config:
      file: index_align_scrs.cwl
      settings: index_align_scrs-params.yml
    bindings:
      - step: /
        target:
          deployment: docker-index_align_scrs
deployments:
  docker-index_align_scrs:
    type: docker
    config:
      image: repbioinfo/carncellranger2
      volume:
        # working directory path   =====================>
        - /home/baseolo/Baryon_SourceCode/test/testdata/index_align_scrs/workdir:/workDir 
        # Genome directory path   =====================>
        - /home/baseolo/Baryon_SourceCode/test/testdata/index_align_scrs/Genome:/genome 
        # Data directory path   =====================>
        - /home/baseolo/Baryon_SourceCode/test/testdata/index_align_scrs/Data:/scratch 